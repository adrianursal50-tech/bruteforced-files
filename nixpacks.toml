# python313 from nixpkgs ships WITHOUT pip. ensurepip bootstraps it from
# the stdlib, then we install the real pip and the requirements.

[phases.setup]
nixPkgs = ["python313", "python313Packages.pip", "gcc"]

[phases.install]
cmds = [
  "python3 -m ensurepip --upgrade",
  "python3 -m pip install --upgrade pip setuptools wheel",
  "python3 -m pip install -r requirements.txt"
]

[start]
cmd = "python3 bot.py"
